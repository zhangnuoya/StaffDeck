; supervisord 配置 - 托管 cc-switch-web、lark-channel-bridge 与 StaffDeck 后端
; 容器 PID 1 由 entrypoint.sh 拉起 supervisord，本文件管理各常驻服务

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=root

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; cc-switch-web: Web 管理界面，监听 0.0.0.0:3000
; 浏览器访问 http://localhost:3000 管理供应商/ API key，写入 ~/.claude/settings.json
; ALLOW_HTTP_BASIC_OVER_HTTP=1: 容器内 HTTP 监听，安全由宿主机端口映射保证
[program:cc-switch-web]
command=/opt/cc-switch/server
directory=/home/appuser
environment=HOST="0.0.0.0",PORT="3000",HOME="/home/appuser",ALLOW_HTTP_BASIC_OVER_HTTP="1"
user=appuser
autostart=true
autorestart=true
startretries=3
stdout_logfile=/home/appuser/.cc-switch-web.stdout.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/home/appuser/.cc-switch-web.stderr.log
stderr_logfile_maxbytes=10MB

; lark-coding-agent-bridge: 连接飞书 PersonalAgent，前台 run 模式
; 首次需 docker exec -it 手动跑一次 run 完成扫码绑定
; 绑定信息持久化到 ~/.lark-channel 后，本进程自动常驻
; 使用 bridge-start.sh wrapper：未配置时保持存活等待，避免反复崩溃
; 工作目录设为 workspace（宿主机挂载），飞书对话中 Claude 操作的文件落在该目录
; startretries=999: 桥接进程偶发退出（如锁残留）时给予充分重试机会
[program:lark-bridge]
command=bridge-start.sh
directory=/home/appuser/workspace
environment=HOME="/home/appuser",PATH="/opt/node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:%(ENV_PATH)s"
user=appuser
autostart=true
autorestart=true
startretries=999
startsecs=3
stdout_logfile=/home/appuser/.lark-bridge.stdout.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/home/appuser/.lark-bridge.stderr.log
stderr_logfile_maxbytes=10MB

; StaffDeck 后端：FastAPI 单端口（API + 前端静态资源），监听 0.0.0.0:5173
; 同容器内 codex 通过 http://127.0.0.1:5173 的 MCP gateway 调用企业工具
; （TOOL_BASE_URL 由 compose environment 注入）。
; ULTRARAG_DOTENV 指向数据卷：部署者可选放 .env（compose environment 优先级更高）。
; 双用户分离：后端以 staffdeck 用户运行，源码/数据/密钥对 codex(appuser) 不可见；
; codex 子进程经 CODEX_CLI_PATH=/usr/local/bin/codex-run（sudo 包装）以 appuser 执行。
; PATH 需含 /opt/staffdeck/venv/bin（uvicorn）与 /opt/node/bin（codex CLI，
; backend 的 codex 适配器通过 codex-run 探测调用）。
[program:staffdeck]
command=/usr/local/bin/staffdeck-start.sh
directory=/opt/staffdeck/backend
environment=HOME="/home/staffdeck",PATH="/opt/staffdeck/venv/bin:/opt/node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",ULTRARAG_DOTENV="/opt/staffdeck/staffdeck-data/.env"
user=staffdeck
autostart=true
autorestart=true
startretries=3
stdout_logfile=/opt/staffdeck/staffdeck-data/logs/staffdeck.stdout.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/opt/staffdeck/staffdeck-data/logs/staffdeck.stderr.log
stderr_logfile_maxbytes=10MB
